# Fork-only configuration (0ll0qp/gitlab-token-expiration, branch dev).
# Builds an unofficial pre-release with a "-dev" binary name, so it can be
# installed next to the official gitlab-token-expiration. Never proposed upstream.
version: 2
project_name: "gitlab-token-expiration-dev"
before:
  hooks:
    - go mod download
builds:
  - binary: gitlab-token-expiration-dev
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X github.com/sgaunet/gitlab-token-expiration/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: ["binary"]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: 0ll0qp
    name: gitlab-token-expiration
  prerelease: true
  name_template: "{{ .Tag }} (dev)"
  header: |
    Unofficial development build of the `dev` branch of this fork: upstream
    https://github.com/sgaunet/gitlab-token-expiration plus pending pull requests.
    The binary is named `gitlab-token-expiration-dev`.
